<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#060b14" />
      <stop offset="50%"  stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00dfc4" />
      <stop offset="45%"  stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00dfc4" stop-opacity="0" />
      <stop offset="30%"  stop-color="#00dfc4" stop-opacity="0.9" />
      <stop offset="60%"  stop-color="#58a6ff" stop-opacity="1" />
      <stop offset="85%"  stop-color="#a371f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0" />
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(88,166,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" rx="12" fill="url(#bgGrad)" />
  <rect width="900" height="200" rx="12" fill="url(#grid)" />

  <!-- Ambient glows -->
  <circle cx="160" cy="55" r="90"  fill="#00dfc4" opacity="0.055" filter="url(#softGlow)" />
  <circle cx="760" cy="130" r="110" fill="#a371f7" opacity="0.055" filter="url(#softGlow)" />

  <!-- Geodesy polygon decoration (top right) -->
  <polygon points="740,18 862,58 838,172 706,188 672,98" fill="none" stroke="#58a6ff" stroke-width="0.8" stroke-dasharray="5,5" opacity="0.2" />
  <circle cx="740"  cy="18"  r="2.5" fill="#00dfc4" opacity="0.7" />
  <circle cx="862"  cy="58"  r="2.5" fill="#58a6ff" opacity="0.7" />
  <circle cx="838"  cy="172" r="2.5" fill="#a371f7" opacity="0.7" />
  <circle cx="706"  cy="188" r="2.5" fill="#00dfc4" opacity="0.7" />
  <circle cx="672"  cy="98"  r="2.5" fill="#58a6ff" opacity="0.7" />
  <!-- Diagonals inside polygon -->
  <line x1="740" y1="18" x2="838" y2="172" stroke="#00dfc4" stroke-width="0.6" opacity="0.12" />
  <line x1="862" y1="58" x2="706" y2="188" stroke="#58a6ff" stroke-width="0.6" opacity="0.12" />

  <!-- Name -->
  <text x="58" y="76"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="42" font-weight="900"
        fill="url(#nameGrad)" letter-spacing="2">
    DURSUN TOSUN
  </text>

  <!-- Subtitle -->
  <text x="60" y="110"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="14.5" font-weight="600"
        fill="#8b949e" letter-spacing="0.8">
    Mining M.Sc. Engineer  ·  Full-Stack Developer  ·  Data Scientist
  </text>

  <!-- Glow divider -->
  <rect x="58" y="128" width="784" height="1.5" fill="url(#glowLine)" />

  <!-- Pillar pills -->
  <g transform="translate(58, 148)">
    <!-- Simplicity -->
    <rect x="0"   y="0" width="148" height="30" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <circle cx="15" cy="15" r="4" fill="#00dfc4" />
    <text x="27" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#c9d1d9">⬡ Sadelik</text>
    <text x="82" y="20" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b949e">/ Clean</text>

    <!-- Security -->
    <rect x="162" y="0" width="148" height="30" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <circle cx="177" cy="15" r="4" fill="#58a6ff" />
    <text x="189" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#c9d1d9">⬡ Güvenlik</text>
    <text x="254" y="20" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b949e">/ Secure</text>

    <!-- Modernity -->
    <rect x="324" y="0" width="148" height="30" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <circle cx="339" cy="15" r="4" fill="#a371f7" />
    <text x="351" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#c9d1d9">⬡ Modernlik</text>
    <text x="424" y="20" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b949e">/ Modern</text>

    <!-- Robust -->
    <rect x="486" y="0" width="158" height="30" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <circle cx="501" cy="15" r="4" fill="#3fb950" />
    <text x="513" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#c9d1d9">⬡ Güçlü Yapı</text>
    <text x="596" y="20" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b949e">/ Robust</text>
  </g>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="899" height="199" rx="11.5" fill="none" stroke="#21262d" stroke-width="1" />
</svg>
